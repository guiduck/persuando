services:
  postgres:
    image: postgres:16-alpine
    container_name: persuando-postgres
    environment:
      POSTGRES_USER: persuando
      POSTGRES_PASSWORD: persuando
      POSTGRES_DB: persuando
    ports:
      - "${POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - persuando-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persuando -d persuando"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: persuando-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - persuando-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  persuando-postgres-data:
  persuando-redis-data:
